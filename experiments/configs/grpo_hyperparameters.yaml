# GRPO hyperparameters of the reported runs (Orig, Clean, Clean+FP, Orig+Filter; seeds 1-3).
# First the paper's settings table (appendix "Training and Evaluation Settings"), then trainer settings that affect
# results but are not in that table.
# Framework and hardware settings are not listed; concurrent_episodes is listed because it bounds how stale a rollout can be.
base_model: Qwen3.5-9B
episode_budget:
  tool_calls: 80
  context: 128K
  temperature: 1.0
rl_algorithm: GRPO
loss: Dr. GRPO
loss_normalization: token losses summed and divided by the constant 155,648 for every run
kl_penalty:
  reference: the base model
  estimator: k3
  coefficient: 1.0e-3
optimizer: Adam
adam_betas: [0.9, 0.98]
weight_decay: 0.01
gradient_norm_clip: 1.0
learning_rate: 2.0e-6
learning_rate_schedule: constant after 5 warm-up steps
tasks_per_step: 16
samples_per_task: 8
steps: 80
seeds: seeds 1-3 for every set; Clean+FP seed K uses the data order of Clean seed K
checkpoint_selection: highest dev-100 pass@1 (4 attempts) over steps 10-80, ties to the later step

# --- not in the settings table ---
seed_values:  # [trainer seed, rollout seed]; the rollout seed sets the task order
  seed_1: [1234, 42]
  seed_2: [2234, 1042]
  seed_3: [3234, 2042]
policy_loss:
  ratio_clip: [0.2, 0.28]  # PPO clip: the policy ratio is clipped to [1 - 0.2, 1 + 0.28]
  truncated_importance_sampling: [0.0, 2.0]  # weight of each sampled token, trainer over inference-engine probability, truncated to this range
  entropy_bonus: 0.0
  advantage: reward minus the group mean, not divided by the group standard deviation and not normalized over the batch
  policy_probabilities: normalized over each token's sampling support (top-k 20, top-p 0.95), as at sampling
  kl_tokens: the trained tokens, with full-vocabulary probabilities
  kl_in_reward: 0.0
optimizer_details:
  adam_eps: 1.0e-8
  warmup: linear from 0 over the first 5 optimizer steps (step s trains at 2e-6 * min(s, 5) / 5)
  optimizer_steps_per_training_step: 1  # all samples of the step's rollout in one optimizer step
  micro_batch_size: 1
  precision: bf16
  dropout: 0.0
rollout:
  top_p: 0.95
  top_k: 20
  max_new_tokens_per_call: 32768
  task_order: shuffled with the rollout seed
  asynchronous: every group is generated by the current policy or the one before it (staleness at most 1), and none is dropped for staleness
  concurrent_episodes: 80
  infrastructure_failures: a group with an episode that failed for infrastructure reasons (container, server or harness error) is dropped, not scored 0
  rejected_model_outputs: a model output that the agent scaffold rejected and re-queried (output length cap, format error) is also trained, with its episode's advantage
reward:
  value: 1 if the final patch resolves the task, else 0
  test_edits: 0 for a patch that edits test files or the test configuration
  test_timeout_s: 2400
