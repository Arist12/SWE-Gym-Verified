# A SWE-bench-format Python collection (SWE-bench and its Python variants, or your own; untested): a JSONL / JSON /
# parquet file or a Hugging Face dataset of records with the SWE-bench fields. See docs/WORKFLOW.md "Other collections".
work_dir: ${TASKAUDIT_WORK:-./work}
workers: 4

dataset:
  adapter: swebench
  path: ${TASKAUDIT_TASKS:-tasks.jsonl}          # or: hf_name: <org>/<dataset>, hf_split: test
  image_template: "swebench/sweb.eval.x86_64.{iid_swebench}:latest"   # {instance_id} {iid_lower} {iid_swegym} ...
  field_map: {}                                  # e.g. {docker_image: image} for collections with other field names

harness:
  backend: auto        # swegym_fork | swebench (uv sync --extra swebench) | script (records carry test_cmd / log_parser)
  timeout_s: 2400
  network: none

llm:
  dry_run: true
  families:
    claude: {provider: anthropic, model: claude-opus-5-5, api_key_env: ANTHROPIC_API_KEY,
             base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"}
    gpt: {provider: openai, model: gpt-6.1-sol, api_key_env: OPENAI_API_KEY, single_turn: true,
          base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"}
  roles:
    leak_judge_b: {provider: openai, model: gpt-5.6-sol, api_key_env: OPENAI_API_KEY,
                   base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"}
